name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ssh_smoke_only:
        description: "true면 SSH·시크릿 검증만 하고 rsync/배포는 생략"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      wipe_full_app_dir:
        description: "true면 /home/ubuntu/app 전체 삭제(모델 포함). false면 코드만 갱신·artifacts는 유지"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.ssh_smoke_only == 'true') }}
    runs-on: ubuntu-latest

    env:
      # 모노레포: 실제 FastAPI 앱 루트 (구 app/ 이전 위치)
      APP_SRC: backend/ontology/apps
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      MAILGUN_WEBHOOK_SIGNING_KEY: ${{ secrets.MAILGUN_WEBHOOK_SIGNING_KEY }}
      MAILGUN_SKIP_VERIFY: ${{ secrets.MAILGUN_SKIP_VERIFY }}
      MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
      MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
      CORS_ORIGINS: "https://www.kanggyeonggu.store,https://kanggyeonggu.store"
      # Spring Gateway (OAuth) — EC2 gateway.env 작성용
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
      NEON_DEV_HOST: ${{ secrets.NEON_DEV_HOST }}
      NEON_DEV_PORT: ${{ secrets.NEON_DEV_PORT }}
      NEON_DEV_DATABASE: ${{ secrets.NEON_DEV_DATABASE }}
      NEON_DEV_USER: ${{ secrets.NEON_DEV_USER }}
      NEON_DEV_PASSWORD: ${{ secrets.NEON_DEV_PASSWORD }}
      NEON_DEV_SSL_MODE: ${{ secrets.NEON_DEV_SSL_MODE }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      FRONTEND_CALLBACK_URL: ${{ secrets.FRONTEND_CALLBACK_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      UPSTASH_REDIS_HOST: ${{ secrets.UPSTASH_REDIS_HOST }}
      UPSTASH_REDIS_PORT: ${{ secrets.UPSTASH_REDIS_PORT }}
      UPSTASH_REDIS_PASSWORD: ${{ secrets.UPSTASH_REDIS_PASSWORD }}
      APP_DIR: /home/ubuntu/app
      VENV_DIR: /home/ubuntu/venv
      LOG_FILE: /home/ubuntu/app.log
      PID_FILE: /home/ubuntu/app.pid
      MAX_RETRIES: 15
      RETRY_INTERVAL: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: |
          if [ -z "$EC2_HOST" ]; then echo "::error::EC2_HOST secret is not set"; exit 1; fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Known hosts entries for $EC2_HOST: $(grep -c . ~/.ssh/known_hosts || echo 0)"

      - name: Verify SSH login (EC2)
        run: |
          SSH_OPTS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new"
          ssh $SSH_OPTS "$EC2_USERNAME@$EC2_HOST" "echo SSH_OK user=\$(whoami) host=\$(hostname)"

      # 모든 EC2 정리를 SSH 단 한 번으로: 여러 번 연결하면 sshd 제한으로 exit 255 발생
      - name: Free disk space on EC2 (before rsync)
        run: |
          WIPE_FULL=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.wipe_full_app_dir }}" = "true" ]; then
            WIPE_FULL=true
          fi
          SSH_OPTS="-o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=accept-new"
          ssh $SSH_OPTS "$EC2_USERNAME@$EC2_HOST" \
            "EC2_APP_DIR=${APP_DIR} EC2_VENV_DIR=${VENV_DIR} WIPE_FULL=$WIPE_FULL bash -s" << 'CLEANUP'
          pkill -f 'python.*main.py' 2>/dev/null || true
          pkill -f "$EC2_VENV_DIR/bin/python" 2>/dev/null || true
          sleep 2

          if [ "$WIPE_FULL" = "true" ]; then
            echo "Full wipe..."
            rm -rf "$EC2_APP_DIR" && mkdir -p "$EC2_APP_DIR"
          else
            echo "Partial clean (keep artifacts)..."
            mkdir -p "$EC2_APP_DIR"
            find "$EC2_APP_DIR" -mindepth 1 -maxdepth 1 -not -name artifacts -exec rm -rf {} + 2>/dev/null || true
          fi

          rm -rf "$HOME/.cache/pip" "$HOME/.cache/pip-tools" 2>/dev/null || true
          find "$HOME/.cache/huggingface/hub" -name "*.incomplete" -delete 2>/dev/null || true
          sudo apt-get clean -y 2>/dev/null || true
          sudo journalctl --vacuum-size=40M 2>/dev/null || true

          avail=$(df -m / | awk 'NR==2 {print $4}')
          echo "Disk free: ${avail} MiB"
          df -h /

          if [ "${avail:-9999}" -lt 1800 ]; then
            echo "Low disk — removing venv to free space"
            rm -rf "$EC2_VENV_DIR" || true
            avail=$(df -m / | awk 'NR==2 {print $4}')
            echo "Disk free after venv removal: ${avail} MiB"
            df -h /
          fi

          if [ "${avail:-9999}" -lt 400 ]; then
            echo "ERROR: Disk still under 400 MiB. Enlarge EBS and re-run."
            exit 1
          fi
          CLEANUP

      - name: Deploy application files
        run: |
          if [ ! -d "$APP_SRC" ]; then echo "::error::APP_SRC directory missing: $APP_SRC"; exit 1; fi
          echo "Creating app dir and transferring files from $APP_SRC (max 180s)..."
          SSH_OPTS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new"
          ssh $SSH_OPTS $EC2_USERNAME@$EC2_HOST "mkdir -p $APP_DIR"
          timeout 180 rsync -avz --delete --info=progress2 \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.git' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='.mypy_cache/' \
            --exclude='.ruff_cache/' \
            --exclude='.pytest_cache/' \
            --exclude='.cache/' \
            --exclude='*.egg-info/' \
            --exclude='artifacts/' \
            --exclude='data/' \
            --exclude='scripts/' \
            --exclude='workers/' \
            --exclude='domain/spokes/soccer/' \
            --include='training/' \
            --include='training/__init__.py' \
            --include='training/shared/' \
            --include='training/shared/**' \
            --exclude='training/**' \
            --exclude='*.safetensors' \
            --exclude='*.pt' \
            --exclude='*.pth' \
            --exclude='*.ckpt' \
            --exclude='*.bin' \
            --exclude='checkpoint-*/' \
            --exclude='prequantized_bnb4/' \
            --timeout=120 \
            -e "ssh $SSH_OPTS" \
            "$APP_SRC/" $EC2_USERNAME@$EC2_HOST:$APP_DIR/ || { echo "::error::rsync timed out or failed"; exit 1; }
          echo "Files transferred OK"

      # 메인 rsync는 artifacts/ 전체 제외. ExaOne + 메일 스팸용 LLaMA(fine_tuned/llama 전체)는 별도 동기화.
      - name: Deploy ExaONE + LLaMA (mail/spam) artifacts
        run: |
          SSH_OPTS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new"
          APP_DIR=/home/ubuntu/app
          for rel in \
            "artifacts/fine_tuned/exaone/prequantized_bnb4" \
            "artifacts/fine_tuned/exaone/competency_adapters" \
            "artifacts/fine_tuned/llama"; do
            if [ ! -d "$APP_SRC/$rel" ]; then
              echo "Skip $rel (not found on runner — 로컬/self-hosted에 아티팩트가 있어야 동기화됨)"
              continue
            fi
            echo "Syncing $rel..."
            ssh $SSH_OPTS $EC2_USERNAME@$EC2_HOST "mkdir -p $APP_DIR/$rel"
            if [[ "$rel" == *"/prequantized_bnb4" ]]; then
              timeout 900 rsync -avz --timeout=600 --info=progress2 \
                --exclude='checkpoint-*/' \
                -e "ssh $SSH_OPTS" "$APP_SRC/$rel/" $EC2_USERNAME@$EC2_HOST:$APP_DIR/$rel/ \
                || { echo "::error::rsync failed for $rel"; exit 1; }
            elif [[ "$rel" == *"/competency_adapters" ]]; then
              rsync -avz --timeout=180 --info=progress2 \
                --exclude='checkpoint-*/' \
                --exclude='prequantized_bnb4/' \
                --exclude='*.pt' \
                --exclude='*.pth' \
                --exclude='*.ckpt' \
                -e "ssh $SSH_OPTS" "$APP_SRC/$rel/" $EC2_USERNAME@$EC2_HOST:$APP_DIR/$rel/ \
                || { echo "::error::rsync failed for $rel"; exit 1; }
            else
              # LLaMA: spam_adapters 등 메일 분류용. 체크포인트만 제외( final_model·토크나이저 등 유지 )
              rsync -avz --timeout=300 --info=progress2 \
                --exclude='checkpoint-*/' \
                --exclude='*.pt' \
                --exclude='*.pth' \
                --exclude='*.ckpt' \
                -e "ssh $SSH_OPTS" "$APP_SRC/$rel/" $EC2_USERNAME@$EC2_HOST:$APP_DIR/$rel/ \
                || { echo "::error::rsync failed for $rel"; exit 1; }
            fi
          done
          echo "ExaONE + LLaMA artifacts sync done"

      - name: Write gateway.env on EC2
        run: |
          SSH_OPTS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new"
          {
            printf 'NEON_DEV_HOST=%s\n'          "${NEON_DEV_HOST}"
            printf 'NEON_DEV_PORT=%s\n'          "${NEON_DEV_PORT:-5432}"
            printf 'NEON_DEV_DATABASE=%s\n'      "${NEON_DEV_DATABASE}"
            printf 'NEON_DEV_USER=%s\n'          "${NEON_DEV_USER}"
            printf 'NEON_DEV_PASSWORD=%s\n'      "${NEON_DEV_PASSWORD}"
            printf 'NEON_DEV_SSL_MODE=%s\n'      "${NEON_DEV_SSL_MODE:-require}"
            printf 'UPSTASH_REDIS_HOST=%s\n'     "${UPSTASH_REDIS_HOST}"
            printf 'UPSTASH_REDIS_PORT=%s\n'     "${UPSTASH_REDIS_PORT:-6379}"
            printf 'UPSTASH_REDIS_PASSWORD=%s\n' "${UPSTASH_REDIS_PASSWORD}"
            printf 'JWT_SECRET=%s\n'             "${JWT_SECRET}"
            printf 'KAKAO_REST_API_KEY=%s\n'     "${KAKAO_REST_API_KEY}"
            printf 'KAKAO_CLIENT_SECRET=%s\n'    "${KAKAO_CLIENT_SECRET}"
            printf 'KAKAO_REDIRECT_URI=%s\n'     "${KAKAO_REDIRECT_URI}"
            printf 'NAVER_CLIENT_ID=%s\n'        "${NAVER_CLIENT_ID}"
            printf 'NAVER_CLIENT_SECRET=%s\n'    "${NAVER_CLIENT_SECRET}"
            printf 'NAVER_REDIRECT_URI=%s\n'     "${NAVER_REDIRECT_URI}"
            printf 'GOOGLE_CLIENT_ID=%s\n'       "${GOOGLE_CLIENT_ID}"
            printf 'GOOGLE_CLIENT_SECRET=%s\n'   "${GOOGLE_CLIENT_SECRET}"
            printf 'GOOGLE_REDIRECT_URI=%s\n'    "${GOOGLE_REDIRECT_URI}"
            printf 'FRONTEND_CALLBACK_URL=%s\n'  "${FRONTEND_CALLBACK_URL}"
            printf 'APP_COOKIE_SECURE=true\n'
            printf 'APP_COOKIE_DOMAIN=kanggyeonggu.store\n'
            printf 'SPRING_PROFILES_ACTIVE=prod\n'
          } | ssh $SSH_OPTS "$EC2_USERNAME@$EC2_HOST" \
              "cat > /home/ubuntu/gateway.env && chmod 600 /home/ubuntu/gateway.env"
          echo "gateway.env written OK"

      - name: Setup virtual environment & start app
        run: |
          echo "Setting up virtual environment and starting application..."
          ssh -o StrictHostKeyChecking=accept-new $EC2_USERNAME@$EC2_HOST bash << ENDSSH
            set -e

            # 변수 설정
            APP_DIR=/home/ubuntu/app
            VENV_DIR=/home/ubuntu/venv
            LOG_FILE=/home/ubuntu/app.log
            PID_FILE=/home/ubuntu/app.pid
            OPENAI_API_KEY_VALUE="$OPENAI_API_KEY"
            DATABASE_URL_VALUE="$DATABASE_URL"
            GEMINI_API_KEY_VALUE="$GEMINI_API_KEY"
            UPSTASH_REDIS_REST_URL_VALUE="$UPSTASH_REDIS_REST_URL"
            UPSTASH_REDIS_REST_TOKEN_VALUE="$UPSTASH_REDIS_REST_TOKEN"
            MAILGUN_WEBHOOK_SIGNING_KEY_VALUE="$MAILGUN_WEBHOOK_SIGNING_KEY"
            MAILGUN_SKIP_VERIFY_VALUE="$MAILGUN_SKIP_VERIFY"
            MAILGUN_DOMAIN_VALUE="$MAILGUN_DOMAIN"
            MAILGUN_API_KEY_VALUE="$MAILGUN_API_KEY"
            CORS_ORIGINS_VALUE="$CORS_ORIGINS"

            cd /home/ubuntu

            # 가상환경 생성
            if [ ! -d "$VENV_DIR" ]; then
              echo "📦 Creating virtual environment..."
              python3 -m venv $VENV_DIR
            else
              echo "✅ Virtual environment exists"
            fi

            # 디스크 공간 확보 (small 인스턴스 97% 사용 시 대응)
            echo "Freeing disk space..."
            source $VENV_DIR/bin/activate
            pip cache purge 2>/dev/null || true
            rm -rf ~/.cache/pip ~/.cache/pip-tools 2>/dev/null || true
            find $VENV_DIR -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            find $APP_DIR -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            if [ -f $LOG_FILE ] && [ \$(wc -l < $LOG_FILE) -gt 500 ]; then
              tail -500 $LOG_FILE > $LOG_FILE.tmp && mv $LOG_FILE.tmp $LOG_FILE
            fi
            rm -rf ~/.cache/huggingface/hub/*.incomplete 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true
            sudo journalctl --vacuum-size=30M 2>/dev/null || true
            df -h /

            # 패키지 설치 (이미 있으면 유지, 없을 때만 설치 → 디스크/시간 절약)
            echo "📥 Installing packages (skip if already satisfied)..."
            pip install --upgrade pip --no-cache-dir
            pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu --no-cache-dir
            sed -e '/^torch==/d' -e '/^torchvision==/d' -e '/^torchaudio==/d' $APP_DIR/requirements.txt > /tmp/requirements-no-torch.txt
            pip install -r /tmp/requirements-no-torch.txt --no-cache-dir

            # 기존 프로세스 종료
            echo "🛑 Stopping existing application..."
            pkill -f "python.*main.py" || true
            pkill -f "$VENV_DIR/bin/python.*main.py" || true
            sleep 2

            # 앱 시작
            echo "🚀 Starting application..."
            cd $APP_DIR

            # Python 경로 설정 (app.model import를 위해)
            export PYTHONPATH="$APP_DIR:\$PYTHONPATH"

            # 환경 변수 설정 (GitHub Secrets → EC2 앱, EC2 ~/.env 수동 불필요)
            export OPENAI_API_KEY="\$OPENAI_API_KEY_VALUE"
            export DATABASE_URL="\$DATABASE_URL_VALUE"
            export GEMINI_API_KEY="\$GEMINI_API_KEY_VALUE"
            export UPSTASH_REDIS_REST_URL="\$UPSTASH_REDIS_REST_URL_VALUE"
            export UPSTASH_REDIS_REST_TOKEN="\$UPSTASH_REDIS_REST_TOKEN_VALUE"
            export MAILGUN_WEBHOOK_SIGNING_KEY="\$MAILGUN_WEBHOOK_SIGNING_KEY_VALUE"
            export MAILGUN_SKIP_VERIFY="\$MAILGUN_SKIP_VERIFY_VALUE"
            export MAILGUN_DOMAIN="\$MAILGUN_DOMAIN_VALUE"
            export MAILGUN_API_KEY="\$MAILGUN_API_KEY_VALUE"
            export CORS_ORIGINS="\$CORS_ORIGINS_VALUE"
            export HOST=0.0.0.0
            export PORT=8000
            export MODE=api
            # 배포 환경: Unsloth/LLaMA 캐시를 /tmp로 두어 앱 디스크 부족 방지
            export UNSLOTH_CACHE_DIR=/tmp/unsloth_compiled_cache

            # 로그 파일 미리 생성
            touch $LOG_FILE

            # 애플리케이션 실행
            nohup $VENV_DIR/bin/python main.py > $LOG_FILE 2>&1 &
            APP_PID=\$!
            echo \$APP_PID > $PID_FILE
            echo "✅ Application started (PID: \$APP_PID)"

            # 프로세스 시작 확인 (FastAPI 바인딩 대기)
            sleep 6
            if ps -p \$APP_PID > /dev/null 2>&1; then
              echo "Process is running"

              # 포트 체크
              sleep 3
              if ss -tlnp 2>/dev/null | grep :8000 || netstat -tlnp 2>/dev/null | grep :8000; then
                echo "✅ Port 8000 is listening"
              else
                echo "⚠️ Port 8000 not listening yet, checking logs..."
                tail -30 $LOG_FILE 2>/dev/null || echo "No log file found"
              fi
            else
              echo "❌ Application failed to start. Checking logs..."
              tail -50 $LOG_FILE 2>/dev/null || echo "No log file found"
              exit 1
            fi
          ENDSSH

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Spring Gateway jar
        run: |
          echo "☕ Building Spring Gateway jar..."
          cd backend/gateway
          chmod +x ./gradlew
          ./gradlew bootJar -x test --no-daemon
          JAR=$(ls "$GITHUB_WORKSPACE/backend/gateway/build/libs/"*.jar | head -1)
          echo "✅ Built: $JAR"
          echo "GATEWAY_JAR=$JAR" >> $GITHUB_ENV

      - name: Deploy Gateway jar to EC2
        run: |
          SSH_OPTS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new"
          echo "📦 Uploading Gateway jar to EC2..."
          rsync -avz --info=progress2 \
            -e "ssh $SSH_OPTS" \
            "$GATEWAY_JAR" \
            "$EC2_USERNAME@$EC2_HOST:/home/ubuntu/gateway.jar"
          echo "✅ Gateway jar uploaded"

      - name: Start Gateway on EC2
        run: |
          SSH_OPTS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new"
          ssh $SSH_OPTS "$EC2_USERNAME@$EC2_HOST" bash -s << 'GWSH'
          # Java 21 설치 (없을 때만)
          if ! command -v java &>/dev/null; then
            echo "📦 Installing Java 21..."
            sudo apt-get update -q
            sudo apt-get install -y -q openjdk-21-jre-headless
          fi
          echo "☕ Java: $(java -version 2>&1 | head -1)"

          # 기존 Gateway 프로세스 종료
          OLD_PID=$(pgrep -f "gateway.jar" || true)
          if [ -n "$OLD_PID" ]; then
            echo "🛑 Stopping old Gateway (PID: $OLD_PID)..."
            kill "$OLD_PID" || true
            sleep 3
          fi

          # gateway.env 존재 확인
          if [ ! -f /home/ubuntu/gateway.env ]; then
            echo "❌ /home/ubuntu/gateway.env not found"
            exit 1
          fi

          # Gateway 실행
          echo "🚀 Starting Gateway..."
          set -a
          source /home/ubuntu/gateway.env
          set +a
          nohup java -jar /home/ubuntu/gateway.jar \
            > /home/ubuntu/gateway.log 2>&1 &
          echo $! > /home/ubuntu/gateway.pid
          echo "Gateway PID: $(cat /home/ubuntu/gateway.pid)"

          # 기동 대기 (최대 60초)
          for i in $(seq 1 20); do
            sleep 3
            if curl -sf http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
              echo "✅ Gateway is UP"
              exit 0
            fi
            echo "⏳ Waiting for Gateway... ($i/20)"
          done
          echo "❌ Gateway failed to start. Last logs:"
          tail -50 /home/ubuntu/gateway.log
          exit 1
          GWSH

      - name: Health check
        run: |
          SSH_OPTS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new"
          echo "🏥 Running health check..."
          for i in $(seq 1 $MAX_RETRIES); do
            echo "⏳ Attempt $i/$MAX_RETRIES..."

            # 프로세스 확인
            if ssh $SSH_OPTS $EC2_USERNAME@$EC2_HOST "ps -p \$(cat $PID_FILE 2>/dev/null) > /dev/null 2>&1"; then
              # Health check
              if ssh $SSH_OPTS $EC2_USERNAME@$EC2_HOST "curl -f http://localhost:8000/health > /dev/null 2>&1"; then
                echo "✅ Health check passed!"
                exit 0
              else
                echo "⚠️ Health check failed, but process is running. Retrying..."
              fi
            else
              echo "❌ Process not found. Checking logs..."
              ssh $SSH_OPTS $EC2_USERNAME@$EC2_HOST "tail -50 $LOG_FILE 2>/dev/null || echo 'No log file'"
            fi

            # 마지막 시도가 아니면 대기
            if [ $i -lt $MAX_RETRIES ]; then
              sleep $RETRY_INTERVAL
            fi
          done

          echo "❌ Health check failed after $MAX_RETRIES attempts. Showing diagnostics..."
          ssh $EC2_USERNAME@$EC2_HOST << 'ENDSSH'
            echo "--- Process Status ---"
            ps aux | grep -E "python.*main.py" | grep -v grep || echo "No process found"
            echo ""
            echo "--- Last 100 lines of logs ---"
            tail -100 /home/ubuntu/app.log 2>/dev/null || echo "No log file found"
            echo ""
            echo "--- Port 8000 status ---"
            ss -tlnp 2>/dev/null | grep :8000 || netstat -tlnp 2>/dev/null | grep :8000 || echo "Port 8000 not listening"
            echo ""
            echo "--- PID file ---"
            cat /home/ubuntu/app.pid 2>/dev/null || echo "No PID file found"
          ENDSSH
          exit 1

  # Actions 탭 → Deploy to EC2 → Run workflow → ssh_smoke_only: true 로 SSH·시크릿만 검증
  ssh-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh_smoke_only == 'true' }}
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: |
          if [ -z "$EC2_HOST" ]; then echo "::error::EC2_HOST secret is not set"; exit 1; fi
          if [ -z "$EC2_USERNAME" ]; then echo "::error::EC2_USERNAME secret is not set"; exit 1; fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify SSH login (EC2)
        run: |
          SSH_OPTS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new"
          ssh $SSH_OPTS "$EC2_USERNAME@$EC2_HOST" "echo SSH_SMOKE_OK user=\$(whoami) host=\$(hostname)"
