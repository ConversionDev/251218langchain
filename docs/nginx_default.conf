# Default server (80)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

# api.kanggyeonggu.store HTTPS (443) -> app :8000
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name api.kanggyeonggu.store;

    # 업로드 본문 한도 (이력서 PDF 등). 기본 1MB → 20MB (백엔드 10MB 한도 + multipart 여유)
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/api.kanggyeonggu.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kanggyeonggu.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSE streaming for LLM chat (10 min timeout, buffering off)
    location /api/agent/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # General API
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Spring Boot Gateway (OAuth)
    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.kanggyeonggu.store;
    return 301 https://$host$request_uri;
}
